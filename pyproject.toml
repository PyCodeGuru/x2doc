[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "x2doc"
version = "0.1.0"
description = "Convert X links to structured Markdown and PDF documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "x2doc contributors" }]
dependencies = [
  "httpx>=0.28,<1",
  "markdown-it-py[linkify,plugins]>=4,<5",
  "playwright>=1.52,<2",
  "pydantic>=2.11,<3",
  "python-slugify>=8,<9",
  "rich>=14,<15",
  "tenacity>=9,<10",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
pdf-weasyprint = ["weasyprint>=65,<67"]
dev = [
  "pytest>=8.4,<10",
  "pytest-httpx>=0.35,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
x2doc = "x2doc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/x2doc"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
testpaths = ["tests"]
markers = ["network: tests that access public network services"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["（", "）", "：", "，", "；", "！", "？"]

[tool.ruff.format]
line-ending = "lf"
